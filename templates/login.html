<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard Pro - Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1a237e;
            --secondary: #3949ab;
            --success: #28a745;
            --danger: #dc3545;
            --dark: #1e1e2d;
        }
        
        body {
            background: linear-gradient(135deg, var(--dark) 0%, #2d2d44 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 50px;
            width: 100%;
            max-width: 420px;
            animation: slideUp 0.5s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .login-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            box-shadow: 0 10px 30px rgba(26, 35, 126, 0.3);
        }
        
        .login-icon i {
            font-size: 2.5rem;
            color: white;
        }
        
        .login-title {
            text-align: center;
            margin-bottom: 10px;
        }
        
        .login-title h2 {
            font-weight: 700;
            color: var(--dark);
        }
        
        .login-subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 35px;
            font-size: 0.95rem;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #495057;
        }
        
        .form-group label i {
            margin-right: 8px;
            color: #6c757d;
        }
        
        .form-control-custom {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s;
            outline: none;
        }
        
        .form-control-custom:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 0.25rem rgba(26, 35, 126, 0.1);
        }
        
        .input-group-custom {
            display: flex;
            align-items: stretch;
        }
        
        .input-group-custom .form-control-custom {
            border-radius: 12px 0 0 12px;
            border-right: none;
            flex: 1;
        }
        
        .input-group-append {
            display: flex;
            align-items: center;
            padding: 0 16px;
            background: white;
            border: 2px solid #e9ecef;
            border-left: none;
            border-radius: 0 12px 12px 0;
            cursor: pointer;
            color: #6c757d;
            transition: all 0.3s;
        }
        
        .input-group-append:hover {
            color: var(--primary);
        }
        
        .btn-login {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            color: white;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(26, 35, 126, 0.3);
        }
        
        .btn-login:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }
        
        .security-badge {
            display: inline-flex;
            align-items: center;
            background: #f8f9fa;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #6c757d;
            margin-top: 20px;
        }
        
        .security-badge i {
            color: var(--success);
            margin-right: 8px;
        }
        
        .alert {
            border-radius: 12px;
            border: none;
        }
        
        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px;
                margin: 20px;
            }
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-icon">
        <i class="fas fa-shield-alt"></i>
    </div>
    
    <div class="login-title">
        <h2>PhishGuard Pro</h2>
    </div>
    
    <div class="login-subtitle">
        Administrator Login
    </div>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show mb-4">
                <i class="fas fa-{{ 'exclamation-circle' if category == 'danger' else 'check-circle' if category == 'success' else 'info-circle' }}"></i>
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    
    <form method="POST" action="{{ url_for('admin_login') }}" id="loginForm">
        <div class="form-group">
            <label for="username"><i class="fas fa-user"></i>Username</label>
            <input type="text" class="form-control-custom" id="username" name="username" placeholder="Enter username" required
                   autocomplete="username" autofocus>
        </div>
        
        <div class="form-group">
            <label for="password"><i class="fas fa-lock"></i>Password</label>
            <div class="input-group-custom">
                <input type="password" class="form-control-custom" id="password" name="password" placeholder="Enter password" required
                       autocomplete="current-password">
                <span class="input-group-append" onclick="togglePassword()" title="Toggle visibility">
                    <i class="fas fa-eye" id="eyeIcon"></i>
                </span>
            </div>
        </div>
        
        <button type="submit" class="btn btn-login" id="submitBtn">
            <i class="fas fa-sign-in-alt me-2"></i>Login
        </button>
    </form>
    
    <div class="text-center">
        <div class="security-badge">
            <i class="fas fa-lock"></i>
            Secure bcrypt hashing enabled
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePassword() {
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.className = 'fas fa-eye-slash';
    } else {
        passwordInput.type = 'password';
        eyeIcon.className = 'fas fa-eye';
    }
}

// Form submission
document.getElementById('loginForm').addEventListener('submit', function() {
    document.getElementById('submitBtn').disabled = true;
    document.getElementById('submitBtn').innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Authenticating...';
});
</script>

</body>
</html>
